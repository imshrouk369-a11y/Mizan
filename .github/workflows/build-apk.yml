name: Build Android APK

# Runs automatically when you upload or change files, and can be started by hand
# from the Actions tab (Run workflow).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Create the Android project, icons, splash screen and widget
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          python3 scripts/add-android-extras.py

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mizan-budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-budget-apk
          path: mizan-budget.apk
          if-no-files-found: error

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" mizan-budget.apk \
            --repo "${{ github.repository }}" \
            --title "Mizan Budget build ${{ github.run_number }}" \
            --notes "Download mizan-budget.apk and open it on your Android phone."
